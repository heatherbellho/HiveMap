<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HiveMap Access</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f5f5;
      margin: 0;
    }
    .login-box {
      background: #fff;
      padding: 24px 28px;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      max-width: 320px;
      width: 100%;
    }
    .login-box h1 {
      font-size: 1.2rem;
      margin: 0 0 12px;
    }
    .login-box p {
      margin: 0 0 16px;
      font-size: 0.9rem;
      color: #555;
    }
    .login-box input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
      box-sizing: border-box;
      margin-bottom: 12px;
    }
    .login-box button {
      width: 100%;
      padding: 8px 10px;
      border-radius: 4px;
      border: none;
      background: #0078d4;
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .login-box button:hover {
      background: #005fa3;
    }
    .error {
      color: #b00020;
      font-size: 0.85rem;
      margin-top: 4px;
      min-height: 1em;
    }
        .logo {
      width: 80px;
      margin-bottom: 20px;
    }
  </style>
  <script>
  // DEV MODE: add ?dev=1 to URL to disable auto‑redirect
  const params = new URLSearchParams(window.location.search);
  const devMode = params.has("dev");

  if (!devMode) {
    const access = JSON.parse(localStorage.getItem("hivemap_access") || "{}");
    if (access.ok) {
      window.location.href = "index.html";
    }
  }
</script>

</head>
<body>
  <div class="login-box">
    <img src="icons/512-hive-map.png" alt="HiveMap Logo" class="logo">
    <h1>HiveMap Access</h1>
    <p>Enter your access code to open HiveMap.<br>You will have received this by e-mail.<br> <a href="https://cornishhoney.co.uk/email_us.php" target="_blank"><strong>E-mail us</strong></a> if you do not have it.</a></p>
<div style="position:relative;">
  <input id="pw" type="password" placeholder="Access code" style="padding-right:40px;">
  <span id="togglePw"
        style="position:absolute; right:10px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:0.9rem; color:#0078d4;">
    Show
  </span>
</div>
    <button type="button" onclick="checkPassword()">Enter</button>
    <div id="error" class="error"></div>
    <div id="accessInfo" style="margin-top:12px; font-size:0.9rem; color:#444;"></div>

  </div>

<script>
  function checkPassword() {
    const input = document.getElementById("pw").value.trim();
    const errorEl = document.getElementById("error");

    // Determine duration from code prefix
    let accessDurationDays = null;

    if (input.startsWith("HM1Y-")) {
      accessDurationDays = 365; // 1 year
    } else if (input.startsWith("HM1M-")) {
      accessDurationDays = 30;  // 1 month
    } else {
      errorEl.textContent = "Incorrect access code.";
      return;
    }

    // Calculate expiry
    const now = new Date();
    const expires = new Date(now.getTime() + accessDurationDays * 24 * 60 * 60 * 1000);

    // Store access
    localStorage.setItem("hivemap_access", JSON.stringify({
      ok: true,
      expires: expires.toISOString(),
      duration: accessDurationDays
    }));

    // Redirect to the app
    window.location.href = "index.html";
  }
</script>

<script>
  const access = JSON.parse(localStorage.getItem("hivemap_access") || "{}");

  if (access.expires) {
    const expiryDate = new Date(access.expires);
    const formatted = expiryDate.toLocaleDateString(undefined, {
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    document.getElementById("accessInfo").innerHTML = `
      Your access expires on <strong>${formatted}</strong>.
      </a>
    `;

    document.getElementById("renewAccessInline").addEventListener("click", () => {
      App.Modals.openRenewModal();
    });
  }
</script>
<script>
  document.getElementById("togglePw").addEventListener("click", () => {
    const pw = document.getElementById("pw");
    const toggle = document.getElementById("togglePw");

    if (pw.type === "password") {
      pw.type = "text";
      toggle.textContent = "Hide";
    } else {
      pw.type = "password";
      toggle.textContent = "Show";
    }
  });
</script>

</body>        
</html>
